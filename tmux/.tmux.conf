# =============================================================================
# Caleb's Tmux Configuration
# Managed by GNU Stow from ~/dotfiles/tmux/.tmux.conf
# =============================================================================
#
# Tmux is a "terminal multiplexer" — it lets you split one terminal into
# many windows and panes, and keeps your work alive even if you close
# the terminal or disconnect from SSH. Think of it like having multiple
# desks inside one room, and even if you leave the room, everything
# stays exactly where you left it.
#
# HOW IT WORKS:
#   1. You press a "prefix" key combo first (Ctrl+a here), then a second key
#      to tell tmux what to do.  Example: Ctrl+a then | = split screen sideways.
#   2. Some keys work WITHOUT the prefix (marked with "-n" below) — just press them.
#   3. Settings that start with "set -g" apply globally to all sessions.
#   4. Settings that start with "setw -g" apply to all windows.
# =============================================================================


# =============================================================================
# General Settings
# =============================================================================

# --- PREFIX KEY ---
# The "prefix" is the key you press first before giving tmux a command.
# By default tmux uses Ctrl+b, but Ctrl+a is easier to reach with one hand
# (your pinky on Ctrl and ring finger on 'a').
unbind C-b                       # Remove the default Ctrl+b prefix
set-option -g prefix C-a         # Set Ctrl+a as the new prefix
bind-key C-a send-prefix         # If you press Ctrl+a twice, send a literal Ctrl+a
                                 # to the program inside tmux (some programs need it)

# --- MOUSE SUPPORT ---
# Let you click on panes to select them, drag borders to resize them,
# scroll with the mouse wheel, and click on windows in the status bar.
# Without this, tmux is keyboard-only.
set -g mouse on

# --- TERMINAL COLOR SUPPORT ---
# These settings make sure colors look correct inside tmux.
# "tmux-256color" tells programs that tmux can show 256 colors.
set -g default-terminal "tmux-256color"
# "Tc" enables "truecolor" (16 million colors) so themes like Tokyo Night
# look exactly right, not washed out or wrong.
set -ga terminal-overrides ",*256col*:Tc"
# Fix clipboard copy/paste sequences so they work over SSH without showing
# garbled characters. The "Ms" sequence tells the terminal how to set the
# clipboard content using the OSC 52 escape code.
set -ga terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"
# Allow programs inside tmux (like Kitty image previews in Yazi) to send
# special escape sequences directly to the outer terminal. Without this,
# tmux would swallow those sequences and features like image preview break.
set -g allow-passthrough on

# --- WINDOW AND PANE NUMBERING ---
# By default, tmux numbers windows and panes starting at 0.
# Starting at 1 is more natural because keyboard number keys start at 1
# on the left side, and there's no 0 key on the left.
set -g base-index 1             # First window is window 1, not window 0
setw -g pane-base-index 1       # First pane in a window is pane 1, not pane 0

# --- AUTO-RENUMBER WINDOWS ---
# If you have windows 1, 2, 3 and close window 2, tmux will rename
# window 3 to window 2 so there are no gaps. Keeps things tidy.
set -g renumber-windows on

# --- SCROLLBACK BUFFER ---
# How many lines of output tmux remembers per pane when you scroll up.
# 50,000 lines is generous — you can scroll way back to see old output.
# (Default is only 2,000 lines.)
set -g history-limit 50000

# --- MESSAGE DISPLAY TIME ---
# When tmux shows you a message (like "Config reloaded!"), it stays
# visible for this many milliseconds. 4000ms = 4 seconds.
set -g display-time 4000

# --- STATUS BAR REFRESH RATE ---
# How often (in seconds) tmux redraws the status bar at the bottom.
# 5 seconds keeps the clock and system info reasonably up to date
# without wasting CPU cycles.
set -g status-interval 5

# --- FOCUS EVENTS ---
# Tells tmux to pass "focus gained" and "focus lost" events to programs
# inside it. Some programs (like Neovim) use these to auto-reload files
# when you switch back to them, so they always show the latest version.
set -g focus-events on

# --- AGGRESSIVE RESIZE ---
# Normally, if two people attach to the same tmux session, the window
# shrinks to fit the smallest screen. With aggressive-resize, each
# window is only as small as the smallest screen CURRENTLY LOOKING AT
# that window — other windows can be full size. Great for multi-monitor.
setw -g aggressive-resize on

# --- ESCAPE TIME ---
# How long (in milliseconds) tmux waits after you press Escape before
# sending it to the program. 0 means instant — no delay. This is
# important for Vim/Neovim where Escape switches modes; a delay would
# make it feel sluggish.
set -s escape-time 0


# =============================================================================
# Key Bindings
# =============================================================================
# REMINDER: Unless marked with "-n" (no prefix), you press Ctrl+a FIRST,
# then the key listed below.

# --- RELOAD CONFIG ---
# Press: Ctrl+a then r
# Re-reads this config file so changes take effect without restarting tmux.
# The "\;" chains a second command that shows a confirmation message.
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- SPLIT PANES ---
# Press: Ctrl+a then |  = split the current pane into LEFT and RIGHT halves
# Press: Ctrl+a then -  = split the current pane into TOP and BOTTOM halves
# The "-c" flag makes the new pane start in the same directory you're in.
# These are more intuitive than the defaults: " (horizontal) and % (vertical),
# which we unbind below since | and - visually resemble the split direction.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'   # Remove old horizontal split key
unbind %     # Remove old vertical split key

# --- PANE SWITCHING WITH ALT+ARROW KEYS (no prefix needed) ---
# Just press Alt + an arrow key to jump to the pane in that direction.
# The "-n" means "no prefix required" — these work instantly.
bind -n M-Left select-pane -L    # Alt+Left  = go to the pane on the left
bind -n M-Right select-pane -R   # Alt+Right = go to the pane on the right
bind -n M-Up select-pane -U      # Alt+Up    = go to the pane above
bind -n M-Down select-pane -D    # Alt+Down  = go to the pane below

# --- PANE SWITCHING WITH VIM KEYS (prefix required) ---
# Press: Ctrl+a then h/j/k/l to move between panes like Vim movement keys.
# h=left, j=down, k=up, l=right — same as moving the cursor in Vim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- SMART PANE SWITCHING (vim-tmux-navigator integration) ---
# This is the magic that lets Ctrl+h/j/k/l work seamlessly between
# tmux panes AND Vim splits. When you press Ctrl+h:
#   - If the current pane is running Vim/Neovim/fzf, send the keypress
#     TO Vim so it moves between its own splits.
#   - If the current pane is NOT Vim, tmux moves to the next pane.
# This way one set of keys works everywhere — no mental switching.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# Handle Ctrl+\ (backslash) — toggles to the last pane.
# The syntax changed in tmux 3.0, so we check the version and use the
# right escaping for whichever version is installed.
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# These do the same vim-tmux-navigator switching, but while you're in
# tmux's "copy mode" (scrolling through history). Without these, Ctrl+h/j/k/l
# wouldn't switch panes while scrolling.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- RESIZE PANES ---
# Press: Ctrl+a then Shift+h/j/k/l (capital H/J/K/L) to resize panes.
# The "-r" flag means "repeatable" — after pressing the prefix once, you
# can keep pressing H/J/K/L to keep resizing without re-pressing Ctrl+a.
# Each press resizes by 5 cells in that direction.
bind -r H resize-pane -L 5   # Make pane 5 cells narrower on the left
bind -r J resize-pane -D 5   # Make pane 5 cells shorter on the bottom
bind -r K resize-pane -U 5   # Make pane 5 cells taller on the top
bind -r L resize-pane -R 5   # Make pane 5 cells wider on the right

# --- CREATE NEW WINDOW ---
# Press: Ctrl+a then c
# Opens a new window (like a new tab) in the same directory you're in.
bind c new-window -c "#{pane_current_path}"

# --- CLAUDE CODE POPUP ---
# Press: Ctrl+a then Ctrl+c
# Opens a floating popup window running Claude Code (AI coding assistant).
# If a "claude" session already exists, it reattaches to it so you don't
# lose your conversation. Press Ctrl+a Ctrl+c again or Escape to hide it.
# The popup takes up 90% width and 85% height of your terminal.
bind C-c display-popup -E -w 90% -h 85% \
  "tmux has-session -t claude 2>/dev/null && tmux attach -t claude || \
   tmux new-session -d -s claude -c '#{pane_current_path}' 'claude' && tmux attach -t claude"

# --- PI CODING AGENT POPUP ---
# Press: Ctrl+a then Ctrl+p
# Same idea as Claude Code above, but for the Pi coding agent.
# Opens a persistent popup session named "pi" so you can toggle it on/off.
bind C-p display-popup -E -w 90% -h 85% \
  "tmux has-session -t pi 2>/dev/null && tmux attach -t pi || \
   tmux new-session -d -s pi -c '#{pane_current_path}' 'pi' && tmux attach -t pi"

# --- PROJECT SESSIONIZER ---
# Press: Ctrl+a then Ctrl+f
# Opens a fuzzy-finder popup listing all your project folders (from
# ~/Documents/GitHub and ~/projects). Pick one and tmux creates a
# dedicated session for that project (or switches to it if it already exists).
# Each project gets its own isolated tmux session with its own windows/panes.
bind C-f display-popup -E -w 60% -h 50% \
  "find ~/Documents/GitHub ~/projects -mindepth 1 -maxdepth 1 -type d 2>/dev/null | \
   fzf --reverse --header='Switch to project session' | \
   xargs -I{} sh -c 'name=$(basename {}); \
   tmux has-session -t \"$name\" 2>/dev/null || tmux new-session -d -s \"$name\" -c \"{}\"; \
   tmux switch-client -t \"$name\"'"

# --- DIRECT WINDOW ACCESS WITH ALT+NUMBER (no prefix needed) ---
# Just press Alt+1 through Alt+9 to jump straight to that window number.
# Way faster than cycling through windows one at a time.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# =============================================================================
# Vi Mode (Vim-style Copy/Paste)
# =============================================================================
# Tmux has a "copy mode" where you can scroll through output and select text.
# These settings make copy mode work like Vim, so the same muscle memory
# applies: v to start selecting, y to copy, movement keys to navigate.

# Use Vim-style keys (h/j/k/l, w, b, /, etc.) when scrolling and selecting.
setw -g mode-keys vi

# Press 'v' to start highlighting text (like Visual mode in Vim).
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Press 'y' to copy (yank) the selected text to the Wayland clipboard.
# "wl-copy" is the Wayland equivalent of xclip — it puts text on the
# system clipboard so you can paste it anywhere (browser, other apps, etc.).
# "copy-pipe-and-cancel" copies the text AND exits copy mode in one step.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Make the Enter key also copy to clipboard (same as 'y' above).
# This overrides the default Enter behavior in copy mode.
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"


# =============================================================================
# Theme (Tokyo Night)
# =============================================================================
# All colors here come from the Tokyo Night color scheme, giving tmux
# a consistent dark blue/purple look that matches the rest of the desktop.
#
# Color reference:
#   #1a1b26 = dark background (almost black with a blue tint)
#   #1f2335 = slightly lighter background
#   #24283b = medium background (used for active elements)
#   #414868 = dim gray-blue (borders, subtle elements)
#   #a9b1d6 = soft gray text (secondary/inactive text)
#   #c0caf5 = bright white-blue text (primary/active text)
#   #7aa2f7 = bright blue (accent color, highlights, active elements)

# --- STATUS BAR ---
# The bar at the bottom of the screen. Dark background with light text.
set -g status-style bg=#1a1b26,fg=#c0caf5

# --- WINDOW TABS IN STATUS BAR ---
# Inactive windows: gray text on dark background (subtle, not distracting)
setw -g window-status-style fg=#a9b1d6,bg=#1a1b26
# Active window: bright blue text on slightly lighter background, bold
# so you can instantly see which window you're on.
setw -g window-status-current-style fg=#7aa2f7,bg=#24283b,bold

# --- PANE BORDERS ---
# The lines between split panes.
# Inactive borders: dim gray so they fade into the background.
set -g pane-border-style fg=#414868
# Active border: bright blue so you can see which pane is selected.
set -g pane-active-border-style fg=#7aa2f7

# --- MESSAGE BAR ---
# When tmux shows a message (like "Config reloaded!"), it uses these colors.
# Blue background with dark text = high contrast, easy to read.
set -g message-style bg=#7aa2f7,fg=#1a1b26

# --- PANE NUMBERS ---
# When you press Ctrl+a then q, tmux briefly shows pane numbers.
# Active pane number = bright blue, other panes = gray.
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#a9b1d6"

# --- CLOCK ---
# When you press Ctrl+a then t, tmux shows a big clock. It's blue.
setw -g clock-mode-colour "#7aa2f7"


# =============================================================================
# Status Bar Layout
# =============================================================================
# The status bar sits at the bottom of the screen and shows:
#   LEFT:   session name (e.g., "command-center")
#   MIDDLE: list of windows (like browser tabs)
#   RIGHT:  date, time, and hostname

# Put the status bar at the bottom of the screen (not the top).
set -g status-position bottom

# Left-align the window list (tabs).
set -g status-justify left

# Maximum character width for left and right sections of the status bar.
set -g status-left-length 50
set -g status-right-length 100

# --- LEFT SIDE: Session Name ---
# Shows a monitor icon (nerd font) followed by the session name (e.g., "command-center").
# Blue background with dark text for high visibility.
# #S = session name
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] 󰍹 #S #[fg=#c0caf5,bg=#1a1b26]"

# --- RIGHT SIDE: Date, Time, Hostname ---
# Shows the current date (YYYY-MM-DD), time (HH:MM), and hostname.
# The hostname section has a blue background to bookend the status bar.
# %Y-%m-%d = date like 2026-03-24, %H:%M = time like 14:30, #H = hostname
set -g status-right "#[fg=#c0caf5,bg=#24283b] %Y-%m-%d #[fg=#c0caf5,bg=#24283b] %H:%M #[fg=#1a1b26,bg=#7aa2f7,bold]  #H "

# --- WINDOW TABS: Inactive ---
# Shows the window number and name in gray. #I = window number, #W = window name.
setw -g window-status-format "#[fg=#a9b1d6,bg=#1a1b26] #I: #W "

# --- WINDOW TABS: Active (current window) ---
# Same info but in bright blue and bold so it stands out.
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#24283b,bold] #I: #W "


# =============================================================================
# Plugins (TPM - Tmux Plugin Manager)
# =============================================================================
# TPM is like a package manager for tmux plugins. It downloads and loads them.
# To install plugins: press Ctrl+a then I (capital i).
# To update plugins:  press Ctrl+a then U (capital u).
# Plugins are stored in ~/.tmux/plugins/

# --- REQUIRED: TPM itself (the plugin manager) ---
set -g @plugin 'tmux-plugins/tpm'

# --- tmux-sensible: A set of good default settings everyone agrees on ---
# Things like longer scrollback, better key bindings, etc.
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- tmux-resurrect: Save and restore tmux sessions ---
# Normally if your computer restarts, all tmux windows/panes are gone.
# Resurrect lets you save the entire layout and restore it later.
# Press Ctrl+a then Ctrl+s to save, Ctrl+a then Ctrl+r to restore.
set -g @plugin 'tmux-plugins/tmux-resurrect'

# --- tmux-continuum: Automatic save/restore ---
# Works with resurrect to automatically save your sessions periodically
# and restore them when tmux starts. You never lose your setup.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tell resurrect to also save/restore Neovim sessions (not just the layout,
# but what files were open in Neovim too).
set -g @resurrect-strategy-nvim 'session'
# Also save what was visible in each pane (the text on screen).
set -g @resurrect-capture-pane-contents 'on'

# Auto-restore the last saved session when tmux starts up.
set -g @continuum-restore 'on'
# Auto-save sessions every 15 minutes so you never lose much work.
set -g @continuum-save-interval '15'

# --- INITIALIZE TPM ---
# This line MUST be at the very bottom of the config file.
# It loads TPM which then loads all the plugins listed above.
run '~/.tmux/plugins/tpm/tpm'
