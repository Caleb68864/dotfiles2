# =============================================================================
# Caleb's Kitty Terminal Configuration
# Managed by GNU Stow from ~/dotfiles/kitty/kitty.conf
# Theme: Tokyo Night
# =============================================================================
#
# Kitty is a GPU-accelerated terminal emulator — the program that provides
# the window where you type commands. It's fast because it uses your
# graphics card (GPU) to draw text, which makes scrolling, resizing, and
# rendering thousands of lines of output buttery smooth.
#
# This file controls how Kitty looks and behaves: fonts, colors, cursor,
# tabs, performance settings, and more.
# =============================================================================


# =============================================================================
# Font Configuration
# =============================================================================
# The font is what makes the text in your terminal readable and pleasant.
# "JetBrainsMono Nerd Font" is a monospaced font (every character is the
# same width, which is essential for code alignment) that includes
# "Nerd Font" icons — thousands of tiny pictures (like folder icons,
# git symbols, language logos) that tools like eza, Starship, and Waybar
# use to make the terminal more visual and informative.
#
# We specify all four variants (regular, bold, italic, bold italic) so
# syntax highlighting and other text styling always look correct.
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

# Font size in points. 12.0 is a comfortable reading size on most screens.
# On HiDPI/4K monitors, the actual pixel size will be larger (scaled automatically).
font_size 12.0


# =============================================================================
# Cursor
# =============================================================================
# The cursor is the blinking/solid shape that shows where your next typed
# character will appear.

# Cursor color: bright white-blue from Tokyo Night theme (matches the foreground text)
cursor #c0caf5

# The color of text that the cursor sits ON TOP OF. Dark background color
# so the character under the cursor is still readable against the bright cursor.
cursor_text_color #1a1b26

# "block" = a solid rectangle. Other options are "beam" (thin line) and
# "underline". Block is the most visible and traditional for terminal use.
cursor_shape block

# Don't blink the cursor. Set to 0 to disable blinking entirely.
# A steady cursor is less distracting, especially when reading code.
# Set to a positive number (in seconds) if you want it to blink.
cursor_blink_interval 0


# =============================================================================
# Scrollback
# =============================================================================
# How many lines of previous output Kitty remembers when you scroll up.
# 10,000 lines is plenty for most work — you can scroll way back to see
# old command output. (Tmux has its own separate scrollback buffer too.)
scrollback_lines 10000


# =============================================================================
# Mouse
# =============================================================================

# How long (in seconds) to wait after you stop moving the mouse before
# hiding the cursor. 3.0 seconds keeps it visible long enough to be
# useful but hides it when you're typing so it doesn't block text.
mouse_hide_wait 3.0

# When Kitty detects a URL (web address) in the terminal output, it
# becomes clickable. This sets the color of those clickable URLs to
# Tokyo Night blue so they stand out.
url_color #7aa2f7

# How URLs are underlined when you hover over them.
# "single" = a single underline. Makes it obvious the text is a link.
url_style single


# =============================================================================
# Window Layout
# =============================================================================
# These control the size and spacing of the Kitty window itself.

# Remember the window size from last time you used Kitty, so it opens
# at the same size instead of resetting to the defaults below.
remember_window_size  yes

# Default window size (in pixels) when Kitty opens for the first time
# or when remember_window_size is off. 1200x800 is a good general size.
initial_window_width  1200
initial_window_height 800

# Padding is empty space between the window edge and the text.
# 8 pixels of padding on all sides makes the text feel less cramped
# and gives the terminal a cleaner, more spacious look.
window_padding_width 8
window_padding_height 8


# =============================================================================
# Tab Bar
# =============================================================================
# Kitty supports tabs (like browser tabs) — multiple terminals in one window.
# The tab bar shows which tabs are open and which one is active.

# Put the tab bar at the top of the window (like a web browser).
tab_bar_edge top

# Use a "powerline" style for tabs — they have angled/slanted edges
# instead of plain flat separators. Looks more modern.
tab_bar_style powerline

# The specific shape of the powerline separators between tabs.
# "slanted" = diagonal lines (/) between tabs.
tab_powerline_style slanted

# --- TAB COLORS ---
# Active tab (the one you're currently on): dark text on bright blue background.
# This makes it really obvious which tab you're looking at.
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7

# Inactive tabs: dim gray text on dark background.
# Subtle and out of the way so they don't distract from the active tab.
inactive_tab_foreground #787c99
inactive_tab_background #1f2335


# =============================================================================
# Color Scheme: Tokyo Night
# =============================================================================
# Every terminal has a set of 16 standard colors (colors 0-15) that programs
# use for output. This section maps those 16 slots to Tokyo Night colors
# so everything looks consistent. Programs don't need to know about
# Tokyo Night specifically — they just ask for "red" or "blue" and the
# terminal gives them the right shade.
#
# Colors come in pairs: "normal" (0-7) and "bright" (8-15).
# For Tokyo Night, many normal and bright variants are the same color,
# which gives a more unified and less jarring look.

# --- BASIC FOREGROUND AND BACKGROUND ---
foreground #c0caf5           # Main text color: soft white with a blue tint
background #1a1b26           # Background: very dark blue (almost black)
selection_foreground #c0caf5 # Text color when you select/highlight text
selection_background #33467c # Background color of selected text: medium blue

# --- THE 16 ANSI COLORS ---
# These are the standard terminal color slots that all programs use.

# Black (color 0 = normal black, color 8 = bright black / dark gray)
color0  #15161e    # Normal black: very dark (used for backgrounds in some programs)
color8  #414868    # Bright black: dim gray-blue (used for comments, subtle text)

# Red (color 1 = normal, color 9 = bright)
color1  #f7768e    # A soft pink-red — used for errors, warnings, deletions
color9  #f7768e    # Same shade (Tokyo Night keeps them unified)

# Green (color 2 = normal, color 10 = bright)
color2  #9ece6a    # A fresh lime green — used for success messages, additions, strings
color10 #9ece6a

# Yellow (color 3 = normal, color 11 = bright)
color3  #e0af68    # Warm amber/gold — used for warnings, types, constants
color11 #e0af68

# Blue (color 4 = normal, color 12 = bright)
color4  #7aa2f7    # Bright periwinkle blue — the main accent color of Tokyo Night
color12 #7aa2f7    # Used for links, functions, UI highlights

# Magenta/Purple (color 5 = normal, color 13 = bright)
color5  #bb9af7    # Soft lavender purple — used for keywords, special values
color13 #bb9af7

# Cyan (color 6 = normal, color 14 = bright)
color6  #7dcfff    # Light sky blue — used for classes, parameters, info text
color14 #7dcfff

# White (color 7 = normal, color 15 = bright)
color7  #a9b1d6    # Normal white: soft gray (secondary text, less important content)
color15 #c0caf5    # Bright white: same as the main foreground color


# =============================================================================
# Advanced Settings
# =============================================================================

# Use Zsh as the default shell inside Kitty (instead of bash or sh).
shell zsh

# Use Neovim as the editor when Kitty needs to open a text editor
# (e.g., for editing scrollback in an external editor with Ctrl+Shift+H).
editor nvim

# Allow other programs to control Kitty remotely (e.g., change colors,
# open new tabs/windows). This is needed for some integrations like
# Yazi's image preview protocol.
allow_remote_control yes

# --- BELL (NOTIFICATION SOUND) ---
# Disable the audio bell — no beeping when something goes wrong or when
# you press Tab with no completions. Beeping is annoying.
enable_audio_bell no

# Also disable the visual bell (a screen flash). No flash, no beep, silence.
visual_bell_duration 0.0

# Don't flash the window or show a badge when a background tab "rings the bell".
# Programs sometimes ring the bell to say "I'm done!" but it's mostly noise.
window_alert_on_bell no


# =============================================================================
# Performance
# =============================================================================
# These settings fine-tune how fast Kitty redraws the screen.

# Minimum time (in milliseconds) between screen redraws. 10ms = up to
# 100 frames per second. Lower = smoother scrolling but more CPU/GPU usage.
repaint_delay 10

# How long (in milliseconds) Kitty waits after receiving input before
# processing it. A tiny 3ms delay lets it batch multiple rapid keystrokes
# together for efficiency, while still feeling instant to you.
input_delay 3

# Sync screen updates with your monitor's refresh rate (like V-Sync in games).
# Prevents "tearing" (where the top and bottom of the screen show different
# frames). Makes scrolling look smooth and clean.
sync_to_monitor yes


# =============================================================================
# OS Specific (Linux / Wayland)
# =============================================================================

# Tell Kitty to use Wayland (the modern Linux display protocol) instead of
# X11 (the old one). Wayland is smoother, more secure, and better for HiDPI.
# Since we're running Hyprland (a Wayland compositor), this is the right choice.
linux_display_server wayland

# Make the window title bar match the terminal background color, so it
# blends in seamlessly instead of having an ugly gray bar at the top.
wayland_titlebar_color background
