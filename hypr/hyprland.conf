# ==============================================================================
# HYPRLAND CONFIGURATION
# ==============================================================================
# This is the main config file for Hyprland, a "window manager" for Linux.
# A window manager controls how application windows are arranged on your screen,
# how you switch between them, and how your desktop looks and feels.
#
# Hyprland runs on "Wayland," which is the modern system that draws things
# on your screen (replacing the older "X11" system).
#
# This file is organized into sections:
#   1. Theme & Scaling  — colors and HiDPI (high-resolution display) settings
#   2. Monitors         — which screens to use and how
#   3. Programs         — shortcuts to favorite apps
#   4. Autostart        — apps that launch automatically when you log in
#   5. Environment      — system-wide settings like cursor size
#   6. Look and Feel    — borders, shadows, animations, gaps
#   7. Input            — keyboard and mouse settings
#   8. Keybindings      — keyboard shortcuts for everything
#   9. Window Rules     — special behavior for specific apps
# ==============================================================================


# --- THEME COLORS ---
# Load our Tokyo Night color scheme from a separate file.
# This gives us color variables like $th_blue, $th_purple, etc.
# that we use throughout this config for borders, shadows, and more.
# Keeping colors in one file means we only change them in one place.
source = ~/.config/hypr/theme.conf


# --- XWAYLAND SCALING ---
# XWayland is a compatibility layer that lets older apps (built for X11)
# run inside our modern Wayland desktop. Some older apps get confused by
# HiDPI (high-resolution) scaling, so we tell XWayland to not scale them
# itself — we handle scaling with the environment variables below instead.
xwayland {
    force_zero_scaling = true
}

# --- HiDPI (HIGH-RESOLUTION DISPLAY) SCALING ---
# These tell GUI toolkits (GTK for GNOME-style apps, Qt for KDE-style apps)
# to draw everything at 2x size. This makes text and icons crisp and readable
# on high-resolution monitors (like 4K screens) instead of tiny and squinted.
# GDK_SCALE=2  -> for GTK apps (Thunar, Firefox, etc.)
# QT_SCALE_FACTOR=2 -> for Qt apps (some system tools)
env = GDK_SCALE,2
env = QT_SCALE_FACTOR,2


################
### MONITORS ###
################

# Tell Hyprland how to set up our screen(s).
# "preferred" = use whatever resolution the monitor says is best
# "auto" for position = let Hyprland figure out where to put it
# "auto" for scale = let Hyprland pick a good zoom level
# This is a safe default that works with any monitor you plug in.
# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# These are variables (like nicknames) for programs we use a lot.
# By defining them here, if we ever want to switch browsers or terminals,
# we only change it in ONE place instead of hunting through the whole file.
# See https://wiki.hypr.land/Configuring/Keywords/

# $browser     — the web browser (Vivaldi, a Chromium-based browser)
$browser = vivaldi
# $terminal    — the terminal emulator (Kitty, a fast GPU-powered terminal)
$terminal = kitty
# $fileManager — the graphical file manager (Thunar, like Windows Explorer)
$fileManager = thunar
# $menu        — the app launcher (like the Start menu — press a key, type an app name)
$menu = hyprlauncher


#################
### AUTOSTART ###
#################

# "exec-once" means "run this command ONE TIME when Hyprland first starts."
# These are background services and apps that should always be running.
# They won't re-launch if you reload the config — only on fresh login.

# Waybar — the status bar at the top/bottom of the screen showing
# time, battery, volume, workspaces, etc. (like the Windows taskbar)
exec-once = waybar

# Hyprpaper — manages the desktop wallpaper (background image)
exec-once = hyprpaper

# Pick a random wallpaper from ~/Pictures/Wallpapers/ each time you log in.
# If that folder is empty, it falls back to the default EndeavourOS wallpaper.
exec-once = ~/.config/hypr/scripts/random-wallpaper.sh

# SwayNC — a notification center. When an app sends a notification
# (like "download complete"), this shows it as a popup on screen.
exec-once = swaync

# Clipboard history — these two commands watch for anything you copy
# (text or images) and save it so you can paste older items later.
# "wl-paste" reads the clipboard; "cliphist store" saves it to history.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Polkit agent — handles permission popups. When an app needs admin/root
# access (like installing software), this shows the "enter your password" dialog.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Hypridle — an idle daemon that watches for inactivity. After a set time
# with no mouse/keyboard input, it can dim the screen, lock it, or suspend.
exec-once = hypridle

# Steam (game store) — launched in silent mode so it starts in the
# system tray without popping up a window. We override GDK_SCALE to 1
# because Steam's UI breaks at 2x scaling and shows a "restart" dialog.
exec-once = env GDK_SCALE=1 steam -silent

# Element Desktop — a chat app for the Matrix messaging protocol
# (like Discord or Slack, but open-source and decentralized).
exec-once = element-desktop

# KWallet PAM init — unlocks the KDE password wallet at login so apps
# that store passwords (like Wi-Fi, email) don't ask you again.
exec-once = /usr/lib/pam_kwallet_init

# Reload Hyprland plugins and then the config itself.
# "hyprpm reload -n" loads any installed plugins (the -n flag and
# 2>/dev/null suppress errors if no plugins exist).
# After a 1-second pause, "hyprctl reload" refreshes the whole config.
# This ensures everything is fully initialized on first boot.
exec-once = hyprpm reload -n 2>/dev/null; sleep 1; hyprctl reload


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Environment variables are system-wide settings that all apps can read.
# See https://wiki.hypr.land/Configuring/Environment-variables/

# Set the mouse cursor size to 24 pixels. Without this, the cursor
# might be tiny on HiDPI screens or inconsistent across apps.
# XCURSOR_SIZE is for X11/XWayland apps, HYPRCURSOR_SIZE is for native Wayland.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# Hyprland can restrict which programs are allowed to do sensitive things
# like taking screenshots or loading plugins. These are commented out
# (disabled) for now, but you could enable them for extra security.
# Changes here require a full Hyprland restart (not just a reload).
# See https://wiki.hypr.land/Configuring/Permissions/

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# This section controls the visual appearance of windows — borders,
# gaps, shadows, blur, rounded corners, and animations.
# Refer to https://wiki.hypr.land/Configuring/Variables/

# --- GENERAL LAYOUT SETTINGS ---
# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # Gaps = the empty space between windows (like margins).
    # gaps_in  = space between two side-by-side windows
    # gaps_out = space between windows and the screen edge
    # Both are 0, so windows fill every pixel with no wasted space.
    gaps_in = 0
    gaps_out = 0

    # How thick the colored border is around each window, in pixels.
    # This border shows which window is "active" (focused).
    border_size = 2

    # Colors for the window border.
    # Active (focused) window: a gradient from blue to purple at a 45-degree angle.
    # Inactive (unfocused) windows: a dim gray color.
    # These $th_ variables come from the theme.conf file we loaded at the top.
    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $th_blue $th_purple 45deg
    col.inactive_border = $th_inactive

    # If true, you could grab and drag window edges to resize them.
    # Disabled here because we use keyboard shortcuts to resize instead.
    resize_on_border = false

    # "Tearing" is a display glitch where the top and bottom of the screen
    # show different frames. Keeping this off prevents visual artifacts.
    # See https://wiki.hypr.land/Configuring/Tearing/ before enabling.
    allow_tearing = false

    # The tiling layout algorithm. "dwindle" splits each new window into
    # progressively smaller halves (like a spiral). It's intuitive — the
    # newest window takes half of whatever space is available.
    layout = dwindle
}

# --- WINDOW DECORATION ---
# Controls visual polish: rounded corners, transparency, shadows, blur.
# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # Round the corners of every window by 10 pixels.
    # Makes windows look softer and more modern (like macOS or mobile apps).
    rounding = 10
    # How "sharp" the rounding curve is. 2 gives a nice smooth circle.
    rounding_power = 2

    # Window transparency (opacity). 1.0 = fully solid, 0.5 = half see-through.
    # Both are 1.0 so windows are completely opaque — no see-through effect.
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Drop shadow — a subtle dark glow behind each window that makes it
    # look like it's "floating" above the desktop (adds depth).
    shadow {
        enabled = true
        # How far the shadow extends outward from the window edge (in pixels).
        range = 4
        # How quickly the shadow fades out. Higher = sharper/darker shadow edge.
        render_power = 3
        # Shadow color from our Tokyo Night theme (a dark, semi-transparent color).
        color = $th_shadow
    }

    # Background blur — when a window is semi-transparent, the stuff behind
    # it gets blurred (frosted glass effect). Since our opacity is 1.0,
    # this mainly affects special transparent surfaces like the app launcher.
    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        # Blur kernel size — bigger = blurrier. 3 is a light blur.
        size = 3
        # Number of blur passes — more passes = smoother but costs more GPU.
        passes = 1

        # Vibrancy boosts the colors of whatever is behind the blur
        # so it doesn't look washed out. A small value for subtle effect.
        vibrancy = 0.1696
    }
}

# --- ANIMATIONS ---
# Animations make windows slide, fade, and pop in/out instead of just
# appearing instantly. This makes the desktop feel smooth and polished.
# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    # "yes, please :)" enables all animations. (The ", please :)" is just
    # a fun Hyprland feature — any text after "yes" is ignored.)
    enabled = yes, please :)

    # --- BEZIER CURVES ---
    # These define the "speed shape" of animations — how fast they start
    # and how they slow down at the end. Think of it like a car:
    #   - "easeOutQuint" = starts fast, slows down gently (like coasting to a stop)
    #   - "easeInOutCubic" = slow start, speeds up, then slows down again
    #   - "linear" = constant speed the whole time (robotic)
    #   - "almostLinear" = mostly constant but with a tiny ease
    #   - "quick" = snappy start, smooth finish
    # The four numbers (X0, Y0, X1, Y1) are control points for a cubic bezier curve.
    # See https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # --- ANIMATION DEFINITIONS ---
    # Each line says: for THIS type of event, use THIS curve at THIS speed.
    # Format: animation = NAME, ON/OFF(1/0), SPEED, CURVE, [STYLE]
    # SPEED is in 100ms units (so 10 = 1 second, 5 = 0.5 seconds).
    # STYLE is optional and changes how the animation looks (e.g., "popin" = scale up from center).
    # See https://wiki.hypr.land/Configuring/Animations/

    # "global" sets the default for ALL animations (1 second, default curve).
    animation = global,        1,     10,    default
    # Border color transitions (when focus changes) — 0.54 seconds, smooth ease.
    animation = border,        1,     5.39,  easeOutQuint
    # Window open/close/move animations.
    animation = windows,       1,     4.79,  easeOutQuint
    # Windows appearing: "popin 87%" means they start at 87% size and scale up.
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    # Windows closing: same popin but faster and linear (snappy disappear).
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    # Fade in/out for windows and other elements.
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    # "Layers" are overlay surfaces like the app launcher, notification popups, etc.
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    # Workspace switching animations (when you press Super+1, Super+2, etc.).
    # "fade" style means workspaces crossfade instead of sliding.
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    # Zoom factor animation for fullscreen transitions.
    animation = zoomFactor,    1,     7,     quick
}

# --- SMART GAPS (DISABLED) ---
# "Smart gaps" would remove borders and gaps when only one window is open
# (since there's nothing to separate it from). These are commented out
# but available if you want a cleaner single-window look.
# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# --- DWINDLE LAYOUT ---
# Dwindle is the tiling algorithm that arranges windows automatically.
# Think of it like splitting a pizza: each new window gets half the remaining space.
# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # Pseudotiling lets a window keep its preferred size instead of filling
    # the whole tile. Toggle it with Super+P on a per-window basis.
    pseudotile = true
    # "preserve_split" remembers whether a tile was split horizontally or
    # vertically, so rearranging windows doesn't shuffle everything around.
    preserve_split = true
}

# --- MASTER LAYOUT ---
# An alternative layout (not currently active — we use dwindle above).
# In "master" layout, one big window is the "master" and others stack beside it.
# If you switch to this, new windows would become the master window.
# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# --- MISCELLANEOUS ---
# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # Don't show the default Hyprland anime wallpaper on empty workspaces.
    # We use our own wallpapers via hyprpaper instead.
    force_default_wallpaper = 0
    # Don't show the Hyprland logo watermark on the desktop.
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

# Settings for keyboard, mouse, and touchpad.
# https://wiki.hypr.land/Configuring/Variables/#input
input {
    # Keyboard layout — "us" is the standard United States QWERTY layout.
    kb_layout = us
    # These are empty because we don't need special keyboard variants,
    # models, options, or rules. They're here as placeholders.
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # Mouse focus behavior:
    # 1 = "focus follows mouse" — whichever window the mouse cursor is over
    # becomes the active window. You don't have to click on it first.
    follow_mouse = 1

    # Automatically turn on Num Lock when Hyprland starts, so the number
    # pad on your keyboard types numbers right away.
    numlock_by_default = true

    # Mouse sensitivity adjustment. 0 = no change from the system default.
    # Negative = slower, positive = faster. Range: -1.0 to 1.0.
    sensitivity = 0

    # Touchpad settings (for laptops).
    touchpad {
        # "natural scroll" = scrolling moves content in the direction your
        # fingers move (like a phone). false = traditional scroll direction
        # (scroll down to move content up, like a scroll wheel).
        natural_scroll = false
    }
}

# --- TOUCHPAD GESTURES ---
# Swiping 3 fingers horizontally on a touchpad switches workspaces.
# This is like swiping between desktops on macOS or Windows.
# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

# Keybindings are keyboard shortcuts that make you do things faster.
# "$mainMod" is a variable for the modifier key — here it's the "Super" key
# (also known as the Windows key or the key with the Windows logo).
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER

# ==============================================================================
# APPLICATION LAUNCHERS
# These shortcuts open your most-used programs.
# ==============================================================================

# Super+W         -> Open the web browser (Vivaldi)
bind = $mainMod, W, exec, $browser
# Super+Enter     -> Open a new terminal window (Kitty)
bind = $mainMod, Return, exec, $terminal
# Super+E         -> Open the graphical file manager (Thunar)
bind = $mainMod, E, exec, $fileManager
# Super+Y         -> Open Yazi (a terminal file manager) in a floating window.
#                    "--class yazi" sets the window class so our window rules
#                    can make it float (see WINDOW RULES section below).
bind = $mainMod, Y, exec, kitty --class yazi -e yazi
# Super+Shift+Y   -> Open Yazi on workspace 3 (the "file manager" workspace).
#                    Uses class "yazi-files" so a different window rule applies.
bind = $mainMod SHIFT, Y, exec, kitty --class yazi-files -e yazi
# Super+Space     -> Open the app launcher (like a Start menu — type to search apps)
bind = $mainMod, Space, exec, $menu

# ==============================================================================
# WINDOW MANAGEMENT
# These shortcuts control how windows behave — close, float, fullscreen, etc.
# ==============================================================================

# Super+Shift+C   -> Close/kill the currently focused window
bind = $mainMod SHIFT, C, killactive,
# Super+M         -> Exit Hyprland entirely (log out). First tries "hyprshutdown"
#                    (a graceful shutdown tool), and if that's not installed,
#                    falls back to the basic hyprctl exit command.
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
# Super+V         -> Toggle the focused window between "floating" (free-moving,
#                    like a normal Windows window) and "tiled" (locked into the
#                    automatic grid layout).
bind = $mainMod, V, togglefloating,
# Super+F         -> Toggle fullscreen mode (window fills the entire screen,
#                    hiding the status bar and other windows). 0 = true fullscreen.
bind = $mainMod, F, fullscreen, 0
# Super+P         -> Toggle "pseudotile" mode on the focused window (dwindle layout).
#                    A pseudotiled window keeps its preferred size inside its tile
#                    instead of stretching to fill it.
bind = $mainMod, P, pseudo,
# Super+T         -> Toggle the split direction in dwindle layout. If the current
#                    tile is split horizontally, it becomes vertical, and vice versa.
bind = $mainMod, T, togglesplit,

# ==============================================================================
# MOVING FOCUS BETWEEN WINDOWS
# These let you switch which window is "active" (highlighted/focused).
# ==============================================================================

# Vim-style movement: Super + H/J/K/L
# H = left, J = down, K = up, L = right
# (These match the keys used in the Vim text editor for navigation.)
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Arrow key fallback: same thing but with arrow keys for people who
# don't know Vim-style navigation.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ==============================================================================
# MOVING WINDOWS AROUND
# These physically move the active window to a different position in the layout.
# ==============================================================================

# Super+Shift + H/J/K/L — swap the focused window with its neighbor
# in that direction. Like picking up a puzzle piece and swapping it.
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# ==============================================================================
# RESIZE MODE (SUBMAP)
# A "submap" is like a temporary mode. You press Super+R to enter "resize mode,"
# then use H/J/K/L to grow or shrink the window, and press Escape to go back
# to normal. This avoids needing a three-key combo for resizing.
# ==============================================================================

# Super+R -> Enter resize mode
bind = $mainMod, R, submap, resize
submap = resize
    # In resize mode:
    # H = shrink width by 50px (move right edge left)
    bind = , H, resizeactive, -50 0
    # L = grow width by 50px (move right edge right)
    bind = , L, resizeactive, 50 0
    # K = shrink height by 50px (move bottom edge up)
    bind = , K, resizeactive, 0 -50
    # J = grow height by 50px (move bottom edge down)
    bind = , J, resizeactive, 0 50
    # Escape = exit resize mode and go back to normal keybindings
    bind = , escape, submap, reset
submap = reset

# ==============================================================================
# WORKSPACE SWITCHING
# Workspaces are like virtual desktops — separate screens you can flip between.
# Think of them as different rooms: workspace 1 has your browser, workspace 2
# has your terminal, etc. You can't see them all at once, but switching is instant.
# ==============================================================================

# Super + number key -> Jump to that workspace (show it on screen).
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Super+Shift + number -> Send the focused window to that workspace SILENTLY.
# "Silent" means you stay on your current workspace — the window just
# disappears to the target workspace. Like mailing a package somewhere.
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Super+Ctrl + number -> Send the focused window to that workspace AND FOLLOW IT.
# Unlike the silent version above, this also switches your view to the
# target workspace. Like carrying the package there yourself.
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# ==============================================================================
# SPECIAL WORKSPACES (SCRATCHPADS)
# Special workspaces are hidden workspaces that slide in/out like a drawer.
# They overlay on top of whatever workspace you're on. Great for things
# you need quick access to without leaving what you're doing.
# ==============================================================================

# Super+A       -> Toggle the "ai" scratchpad (show/hide the AI assistant workspace)
bind = $mainMod, A, togglespecialworkspace, ai
# Super+Shift+A -> Move the focused window INTO the "ai" scratchpad
bind = $mainMod SHIFT, A, movetoworkspace, special:ai

# Super+S       -> Toggle the "magic" scratchpad (a general-purpose hidden workspace)
bind = $mainMod, S, togglespecialworkspace, magic
# Super+Shift+S -> Move the focused window INTO the "magic" scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ==============================================================================
# MOUSE CONTROLS
# ==============================================================================

# Super + scroll wheel -> Scroll through workspaces one by one.
# Mouse wheel down = next workspace, mouse wheel up = previous workspace.
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Super + left mouse button drag  -> Move (drag) a floating window around
# Super + right mouse button drag -> Resize a floating window by dragging
# "bindm" is a special bind type for mouse actions.
# mouse:272 = left click, mouse:273 = right click.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================================================================
# SCREENSHOTS
# Uses "hyprshot," a screenshot tool built for Hyprland.
# ==============================================================================

# Print Screen              -> Select a region of the screen to capture (like Snipping Tool)
bind = , Print, exec, hyprshot -m region
# Shift + Print Screen      -> Capture the currently focused window
bind = SHIFT, Print, exec, hyprshot -m window
# Super + Print Screen      -> Select a region AND save to ~/Pictures/Screenshots/
bind = $mainMod, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
# Ctrl + Print Screen       -> Capture the entire monitor/screen
bind = CTRL, Print, exec, hyprshot -m output

# ==============================================================================
# UTILITY SHORTCUTS
# ==============================================================================

# Super+Backspace -> Lock the screen (shows the lock screen, requires password to unlock)
bind = $mainMod, BackSpace, exec, hyprlock

# Super+N        -> Toggle the notification center sidebar (show/hide notifications)
#                   "-t" = toggle, "-sw" = show widget
bind = $mainMod, N, exec, swaync-client -t -sw

# Super+Shift+W  -> Restart Waybar (the status bar). Useful if Waybar glitches
#                   or after editing its config files. Kills it and relaunches.
bind = $mainMod SHIFT, W, exec, killall waybar && waybar &

# ==============================================================================
# MEDIA / HARDWARE KEYS
# These bind the special keys found on laptops and multimedia keyboards.
# "bindel" = bind + event + locked (works even on lock screen, repeats when held)
# "bindl"  = bind + locked (works on lock screen, does NOT repeat)
# ==============================================================================

# Volume keys — uses WirePlumber (wpctl) to control audio.
# @DEFAULT_AUDIO_SINK@ = whatever speakers/headphones are currently active.
# Raise volume by 5% (capped at 100% with -l 1 to prevent distortion)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# Lower volume by 5%
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Mute/unmute speakers
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Mute/unmute microphone
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screen brightness keys — uses brightnessctl to adjust the display backlight.
# -e4 = exponential curve (small changes at low brightness, bigger at high)
# -n2 = never go below 2% (so the screen doesn't go completely black)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# ==============================================================================
# PI CODING AGENT
# Pi is an AI coding assistant. These shortcuts open it in different ways.
# ==============================================================================

# Super+Shift+P  -> Open a full Pi development workspace in a terminal.
#                   "pi-workspace" is a script that creates a tmux layout with
#                   Neovim (code editor) on the left and Pi (AI agent) on the right.
bind = $mainMod SHIFT, P, exec, kitty -e pi-workspace
# Super+Shift+N  -> Open Pi in a floating notes window, starting in the
#                   ~/Documents/Notes/Logic directory. The "--class pi-notes"
#                   lets our window rules make it float at a specific size.
bind = $mainMod SHIFT, N, exec, kitty --class pi-notes -d ~/Documents/Notes/Logic -e pi

# ==============================================================================
# MEDIA PLAYBACK CONTROLS
# These control whatever media player is currently active (Spotify, browser, etc.)
# using "playerctl," a command-line media player controller.
# "bindl" means these work even when the screen is locked.
# ==============================================================================

# Next track / Pause-play / Previous track
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Window rules tell Hyprland how to treat specific applications.
# Each rule matches windows by their "class" (an internal name the app gives itself)
# and applies special behavior like forcing them to a specific workspace,
# making them float, or setting a specific size.
#
# See https://wiki.hypr.land/Configuring/Window-Rules/
# See https://wiki.hypr.land/Configuring/Workspace-Rules/
#
# NOTE: Do NOT use "windowrulev2" — it is deprecated in Hyprland 0.54+.
# Use "windowrule { }" block syntax or "windowrule = rule, match:class ^regex$" instead.

# --- GLOBAL RULES (apply to ALL windows) ---

# Prevent any app from "maximizing" itself. Many apps try to auto-maximize
# on startup, which fights with our tiling layout. This tells Hyprland
# to ignore those maximize requests so tiling stays in control.
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Fix a bug with XWayland (the X11 compatibility layer). Sometimes tiny,
# invisible XWayland windows steal keyboard focus, making it seem like
# your keyboard stopped working. This rule says: if a window has no class,
# no title, is an XWayland window, is floating, not fullscreen, and not pinned,
# then don't let it steal focus.
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# --- HYPRLAND-RUN DIALOG ---
# "hyprland-run" is a small run dialog. This makes it float and positions
# it near the bottom of the screen (20px from the left, 120px from the bottom).
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# ==============================================================================
# WORKSPACE ASSIGNMENTS
# These rules automatically send specific apps to designated workspaces.
# "silent" means the app opens in the background without switching your view.
#
# Current organization:
#   Workspace 1: Web browsers
#   Workspace 2: Terminals (Kitty)
#   Workspace 3: File managers (Thunar, Yazi)
#   Workspace 4: Chat/communication apps (Discord, Element)
#   Workspace 7: Steam (game store)
#   Workspace 8: Heroic (game launcher for Epic/GOG games)
# ==============================================================================
windowrule = workspace 1 silent, match:class ^(vivaldi-stable)$
windowrule = workspace 4 silent, match:class ^(discord)$
windowrule = workspace 4 silent, match:class ^(vesktop)$
windowrule = workspace 4 silent, match:class ^(Element)$
windowrule = workspace 4 silent, match:class ^(element)$
windowrule = workspace 2 silent, match:class ^(kitty)$
windowrule = workspace 3 silent, match:class ^(thunar)$

# --- YAZI FLOATING WINDOW ---
# When Yazi is opened with Super+Y (class "yazi"), make it a floating window
# centered on screen at 1200x800 pixels. This is handy for quick file browsing
# without disrupting your tiled layout — like a popup file picker.
windowrule {
    name = yazi-float
    match:class = ^(yazi)$

    float = yes
    size = 1200 800
    center = yes
}

# --- YAZI ON WORKSPACE 3 ---
# When Yazi is opened with Super+Shift+Y (class "yazi-files"), send it to
# workspace 3 (the file manager workspace) as a floating centered window.
# This is for when you want Yazi as your main file manager alongside Thunar.
windowrule {
    name = yazi-files-ws3
    match:class = ^(yazi-files)$

    workspace = 3 silent
    float = yes
    size = 1200 800
    center = yes
}

# --- RIPDRAG (DRAG-AND-DROP HELPER) ---
# Ripdrag is a small tool that lets you drag files from Yazi (terminal file manager)
# into graphical apps. It creates a tiny window showing the files you're dragging.
# This rule makes that window float, centered, at a small 400x400 size.
windowrule {
    name = ripdrag-float
    match:class = ^(it.catboy.ripdrag)$

    float = yes
    center = yes
    size = 400 400
}

# --- PI NOTES FLOATING WINDOW ---
# When Pi (AI coding agent) is opened for note-taking with Super+Shift+N
# (class "pi-notes"), make it a large floating window (1600x1000) centered
# on screen. This gives plenty of room for AI-assisted note editing.
windowrule {
    name = pi-notes-float
    match:class = ^(pi-notes)$

    float = yes
    size = 1600 1000
    center = yes
}

# --- GAMING APPS ---
# Steam (game store/launcher) goes to workspace 7.
windowrule = workspace 7 silent, match:class ^(steam)$
# Heroic Games Launcher (for Epic Games and GOG games) goes to workspace 8.
windowrule = workspace 8 silent, match:class ^(heroic)$
