# =============================================================================
# aerc -- Vim-Style Keybindings
# =============================================================================
# Managed by GNU Stow from ~/dotfiles/aerc/binds.conf
# Stow target: ~/.config/aerc/binds.conf
#
# Designed to feel like NeoVim/NeoMutt. The essentials:
#   j/k     = move up/down
#   gg/G    = top/bottom
#   l/Enter = open, h/q = close/back
#   E       = export email to Obsidian
#   V       = open HTML in browser
#   W       = save raw email source
#
# Start with these, use for a few days, then tweak to fit your hands.
# Check available commands: :help keys inside aerc.
# =============================================================================


# =============================================================================
# Global (works everywhere)
# =============================================================================
[global]
<C-q> = :quit<Enter>
?     = :help keys<Enter>


# =============================================================================
# Message List (your inbox / folder view)
# =============================================================================
[messages]

# --- Movement (vim-style) ---
j       = :next<Enter>
k       = :prev<Enter>
gg      = :select 0<Enter>
G       = :select -1<Enter>
J       = :next 5<Enter>
K       = :prev 5<Enter>

# --- Page movement ---
<C-d>   = :next 50%<Enter>
<C-u>   = :prev 50%<Enter>
<C-f>   = :next 100%<Enter>
<C-b>   = :prev 100%<Enter>

# --- Open / close ---
<Enter> = :view<Enter>
l       = :view<Enter>
q       = :quit<Enter>

# --- Folder / account navigation ---
h       = :collapse-folder<Enter>
L       = :expand-folder<Enter>
<tab>   = :next-tab<Enter>
<backtab> = :prev-tab<Enter>
gt      = :next-tab<Enter>
gT      = :prev-tab<Enter>

# --- Search ---
/       = :search<space>
n       = :next-result<Enter>
N       = :prev-result<Enter>

# --- Email actions ---
r       = :reply<Enter>
R       = :reply -a<Enter>
f       = :forward<Enter>
m       = :compose<Enter>
D       = :delete<Enter>
d       = :move Trash<Enter>
u       = :unmark<Enter>
a       = :archive flat<Enter>
t       = :toggle-threads<Enter>

# --- Marking (select multiple) ---
<space> = :mark -t<Enter>
*       = :mark -a<Enter>

# --- Flag / star ---
!       = :flag -t<Enter>

# --- Open externally ---
o       = :open<Enter>

# --- Change folder ---
c       = :cf<space>

# --- Shell / terminal ---
$       = :term<space>

# === CUSTOM: Obsidian export ===
# Press E to export the selected email to your Obsidian vault as Markdown.
E       = :pipe -b ~/.local/bin/mail-to-obsidian<Enter>

# === CUSTOM: Open HTML in browser ===
# Press V to view the full HTML email in qutebrowser (images, CSS, etc.)
V       = :pipe -b ~/.local/bin/open-mail-html<Enter>

# === CUSTOM: Save raw email source ===
# Press W to save the raw .eml file for debugging or archival.
W       = :pipe -b ~/.local/bin/save-raw-email<Enter>


# =============================================================================
# Message Viewer (reading an open email)
# =============================================================================
[view]

# --- Scroll (vim-style) ---
j       = :next-part<Enter>
k       = :prev-part<Enter>
gg      = :prev-part<Enter>
G       = :next-part<Enter>

# --- Page movement ---
<C-d>   = :next 50%<Enter>
<C-u>   = :prev 50%<Enter>
<space> = :next 100%<Enter>

# --- Close / back ---
q       = :close<Enter>
h       = :close<Enter>

# --- Navigate between messages while in viewer ---
J       = :next<Enter>
K       = :prev<Enter>

# --- Email actions (same as message list) ---
r       = :reply<Enter>
R       = :reply -a<Enter>
f       = :forward<Enter>
D       = :delete<Enter>
d       = :move Trash<Enter>
a       = :archive flat<Enter>

# --- Attachments ---
o       = :open<Enter>
s       = :save<space>

# --- Extract URLs ---
<C-u>   = :pipe -b urlscan<Enter>

# === CUSTOM: Same export/browser/save bindings ===
E       = :pipe -b ~/.local/bin/mail-to-obsidian<Enter>
V       = :pipe -b ~/.local/bin/open-mail-html<Enter>
W       = :pipe -b ~/.local/bin/save-raw-email<Enter>


# =============================================================================
# Compose (writing an email)
# =============================================================================
[compose]
<C-s>     = :send<Enter>
<C-q>     = :abort<Enter>
<tab>     = :next-field<Enter>
<backtab> = :prev-field<Enter>

[compose::review]
y       = :send<Enter>
n       = :abort<Enter>
e       = :edit<Enter>
a       = :attach<space>


# =============================================================================
# Terminal (embedded terminal inside aerc)
# =============================================================================
[terminal]
<C-w>   = :close<Enter>
