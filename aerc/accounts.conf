# =============================================================================
# aerc -- Account Configuration
# =============================================================================
# Managed by GNU Stow from ~/dotfiles/aerc/accounts.conf
# Stow target: ~/.config/aerc/accounts.conf
#
# IMPORTANT: This file contains PLACEHOLDERS that you MUST edit before use.
# Replace all YOUR_* values with your actual credentials/settings.
#
# SECURITY: This file should be chmod 600 (only you can read it).
# The install.sh script handles this automatically.
#
# aerc supports multiple accounts. Each [section] is one account.
# You switch between them with :next-account / :prev-account or
# the account tabs at the top.
# =============================================================================


# =============================================================================
# Microsoft 365 / Outlook Account
# =============================================================================
# Authentication: OAuth2 via oauth2ms or mutt_oauth2.py
#
# PREREQUISITES:
#   1. Register an app in Azure Portal (Entra ID):
#      - Go to: portal.azure.com > App registrations > New registration
#      - Redirect URI: http://localhost (for device code flow)
#      - API permissions: IMAP.AccessAsUser.All, SMTP.Send, offline_access
#      - Enable "Allow public client flows" under Authentication
#      - Note your: Application (client) ID and Tenant ID
#
#   2. Install oauth2ms:
#      yay -S oauth2ms
#
#   3. Configure oauth2ms:
#      Create ~/.config/oauth2ms/config.json:
#      {
#        "tenant_id": "YOUR_MS_TENANT_ID",
#        "client_id": "YOUR_MS_CLIENT_ID",
#        "client_secret": "",
#        "redirect_host": "localhost",
#        "redirect_port": "5000",
#        "scopes": ["https://outlook.office365.com/.default"],
#        "authority": "https://login.microsoftonline.com/YOUR_MS_TENANT_ID"
#      }
#
#   4. Authenticate:
#      oauth2ms --authorize
#      (Opens browser for Microsoft login, stores token locally)
#
# NOTE: If your organization's IT policies block custom app registrations
# or disable IMAP/SMTP access, this won't work. You'll need to use the
# Outlook web app or ask IT to whitelist your app.
# =============================================================================

[Outlook365]
source         = imaps://YOUR_OUTLOOK_EMAIL@outlook.office365.com:993
source-cred-cmd = oauth2ms
outgoing       = smtp+oauthbearer://YOUR_OUTLOOK_EMAIL@smtp.office365.com:587
outgoing-cred-cmd = oauth2ms
default        = INBOX
from           = YOUR_FULL_NAME <YOUR_OUTLOOK_EMAIL>
copy-to        = Sent Items
# cache-headers  = true
# Folders to show in sidebar (comment out to show all)
# folders        = INBOX,Sent Items,Drafts,Archive,Junk Email


# =============================================================================
# Gmail Account
# =============================================================================
# Authentication: OAuth2 or App Password
#
# OPTION A: App Password (simplest, recommended for personal Gmail)
#   1. Enable 2-Step Verification on your Google account
#   2. Go to: myaccount.google.com > Security > App passwords
#   3. Generate an app password for "Mail"
#   4. Store it encrypted:
#      echo "your-app-password" | gpg --encrypt -r YOUR_GPG_KEY_ID > \
#        ~/.config/aerc/gmail-pass.gpg
#   5. Set source-cred-cmd below to decrypt it
#
# OPTION B: OAuth2 (more complex, more "proper")
#   1. Create a Google Cloud project
#   2. Enable Gmail API
#   3. Create OAuth2 credentials (Desktop application)
#   4. Use mutt_oauth2.py or similar token helper
#   5. Replace source-cred-cmd with the OAuth2 helper command
#
# The config below uses Option A (App Password with GPG encryption).
# =============================================================================

[Gmail]
source         = imaps://YOUR_GMAIL_EMAIL@imap.gmail.com:993
source-cred-cmd = gpg --quiet --batch --decrypt ~/.config/aerc/gmail-pass.gpg
outgoing       = smtps://YOUR_GMAIL_EMAIL@smtp.gmail.com:465
outgoing-cred-cmd = gpg --quiet --batch --decrypt ~/.config/aerc/gmail-pass.gpg
default        = INBOX
from           = YOUR_FULL_NAME <YOUR_GMAIL_EMAIL>
copy-to        = [Gmail]/Sent Mail
# Gmail uses labels as folders. Common ones:
# folders        = INBOX,[Gmail]/Sent Mail,[Gmail]/Drafts,[Gmail]/All Mail,[Gmail]/Spam
