# =============================================================================
# aerc -- Main Configuration
# =============================================================================
# Managed by GNU Stow from ~/dotfiles/aerc/aerc.conf
# Stow target: ~/.config/aerc/aerc.conf
#
# aerc is a terminal email client written in Go. It uses tabs (like a browser),
# vim-style keybindings, and supports multiple accounts. This file controls
# the general behavior -- accounts are in accounts.conf, keys in binds.conf.
#
# Docs: https://man.sr.ht/~rstrstrp/aerc/
# =============================================================================

[general]
# Where to save downloaded files (attachments you explicitly save)
default-save-path = ~/Downloads

# Enable unsafe HTML rendering (needed for complex emails)
unsafe-headers-for-accounts =

[ui]
# Timestamp format for the message list (Go time format)
# 2006-01-02 is Go's reference date (like strftime but different)
timestamp-format = 2006-01-02 15:04

# Sidebar (folder list) width in characters
sidebar-width = 25

# Show the sidebar on startup
sidebar-visible = true

# Mouse support (click folders, messages, etc.)
mouse-enabled = true

# How to display messages in the message list
# %D = date, %a = sender address, %f = sender name, %s = subject
# %Z = flags (N=new, R=replied, F=flagged, etc.)
index-columns = date<10,name<20,flags>4,subject<*
column-date = {{.DateAutoFormat .Date.Local}}
column-name = {{index (.From | names) 0}}
column-flags = {{.Flags | join ""}}
column-subject = {{.Subject}}

# Thread messages by conversation
threading-enabled = true

# How to sort messages (newest first)
sort = -r date

# Fuzzy tab completion
completion-delay = 250ms
completion-min-chars = 1

# Style for unread messages (bold)
[ui:folder~.INBOX]
# You can add per-folder UI overrides here

[statusline]
# What to show in the status bar at the bottom
display-mode = text
status-columns = left<*,right>*
column-left = {{.Account}} | {{.Folder}} | {{.TotalMessages}} messages, {{.Unread}} unread
column-right = {{.StatusInfo}}

[viewer]
# How to display email headers when reading a message
header-layout = From|To,Cc|Date,Subject

# Pipe HTML emails through this filter for terminal rendering
# (configured in filters file)
always-show-mime = false

# Preferred order: show plain text first, fall back to HTML
alternatives = text/plain,text/html

# Don't automatically mark messages as read when you open them
# (lets you skim without losing the "unread" marker)
auto-mark-read = true

[compose]
# Default editor for composing emails (uses $EDITOR if not set)
editor = nvim

# Add these headers when composing
header-layout = To|From,Subject

# Reply format: quote the original message
reply-to-self = false

# Signature file (optional -- uncomment and create the file)
# signature-file = ~/.config/aerc/signature
# signature-cmd =

[filters]
# These filters convert MIME types to text for terminal display.
# aerc pipes email parts through these commands to render them.
#
# text/plain = just show it as-is (cat)
# text/html  = convert to readable text using w3m
# text/*     = fallback for any other text type
# image/*    = show a placeholder (can't display inline in terminal)
#
# The filter files are in ~/.config/aerc/filters/
text/plain = cat
text/html = w3m -dump -o display_link_number=true -T text/html
text/* = cat
image/* = catimg -w $(tput cols) -
application/pdf = pdftotext - -

[openers]
# Programs to use when you press 'o' (open) on an attachment
# These open the file in an external program
text/html = qutebrowser
image/* = imv
application/pdf = zathura
